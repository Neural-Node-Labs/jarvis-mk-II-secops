services:

  # ─── Single container: React (nginx) + FastAPI (uvicorn) ─────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    environment:
      # ── LLM API Keys ──
      DEEPSEEK_API_KEY:   ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY:  ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY:     ${OPENAI_API_KEY:-}
      # ── Ollama (point to external host if needed) ──
      OLLAMA_HOST:        ${OLLAMA_HOST:-http://ollama:11434}
      # ── Runtime ──
      LOG_LEVEL:          ${LOG_LEVEL:-info}
      PYTHONUNBUFFERED:   "1"
    volumes:
      # ── EXPOSED TO HOST ──
      # Settings and provider configs — maps to a './data' folder on your host
      - type: bind
        source: ./jarvis/data
        target: /app/data

      # Experienced knowledge base — maps to a './experienced' folder on your host
      - type: bind
        source: ./jarvis/experienced
        target: /app/experienced

      # Host filesystem access for the filesystem skill
#      - type: bind
#        source: ${HOST_MOUNT:-/}
#        target: /host
#        read_write: true

      # Custom host output folder mount
      - type: bind
        source: ${HOST_OUTPUT:-./jarvis/output}
        target: /app/output

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  # ─── Ollama (optional local Llama) ───────────────────────────────────────────
#  ollama:
#    image: ollama/ollama:latest
#    container_name: jarvis-ollama
#    restart: unless-stopped
#    volumes:
#      # ── EXPOSED TO HOST ──
#      # Ollama models — maps to a './ollama_models' folder on your host
#      - type: bind
#        source: ./ollama_models
#        target: /root/.ollama

# All named volumes have been removed because everything is now managed directly on your host machine.