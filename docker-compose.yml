services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sir-app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${PORT:-80}:80"
    environment:
      LLM_PROVIDER:       ${LLM_PROVIDER:-ollama}
      # This points the application directly to your customized engine
      LLM_MODEL:          ${LLM_MODEL:-qwen2.5-coder:0.5b}
      #LLM_MODEL:          ${LLM_MODEL:-obedient-coder}
      LIGHTWEIGHT_MODEL:  ${LIGHTWEIGHT_MODEL:-0}
      DEEPSEEK_API_KEY:   ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY:  ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY:     ${OPENAI_API_KEY:-}
      OLLAMA_HOST:        ${OLLAMA_HOST:-http://ollama:11434}
      LOG_LEVEL:          ${LOG_LEVEL:-info}
      PYTHONUNBUFFERED:   "1"
      PUID: ${PUID:-1001}
      PGID: ${PGID:-1001}
    volumes:
      - type: bind
        source: ./sir/data
        target: /app/data
      - type: bind
        source: ./sir/experienced
        target: /app/experienced
      - type: bind
        source: ${HOST_OUTPUT:-./sir/output}
        target: /app/output
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
#    depends_on:
#      ollama:
#        condition: service_healthy


  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Not published to the host: only the gateway (on the internal
    # network) can reach Ollama. Publishing 11434 to the host would let
    # anyone bypass the gateway's auth/rate-limiting entirely and talk
    # to the model directly.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 5
        if ! ollama list | grep -q 'qwen2.5-coder:0.5b'; then
          echo "Pulling qwen2.5-coder:0.5b..."
          ollama pull qwen2.5-coder:0.5b
        fi
        wait
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - type: bind
        source: ./ollama_models
        target: /root/.ollama




