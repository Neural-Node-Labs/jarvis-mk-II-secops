[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

; ─── nginx ────────────────────────────────────────────────────────────────────
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ─── FastAPI (uvicorn) ────────────────────────────────────────────────────────
; NOTE: uvicorn --log-level only accepts lowercase (info, debug, warning, etc.)
; We lowercase the env var with a shell wrapper to be safe.
[program:uvicorn]
command=bash -c "python3 -m uvicorn main:app --host 127.0.0.1 --port 8001 --log-level $(echo ${LOG_LEVEL:-info} | tr '[:upper:]' '[:lower:]')"
directory=/app
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=
    SETTINGS_PATH="/app/data/settings.json",
    EXPERIENCED_PATH="/app/experienced",
    PYTHONUNBUFFERED="1"